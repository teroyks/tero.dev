repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.16
    hooks:
      - id: rumdl      # Lint
        args: [--fix]  # Auto-fix violations in place
      - id: rumdl-fmt  # Pure format, always exits 0

  - repo: local
    hooks:
      - id: check-frontmatter
        name: check post front matter
        entry: node scripts/check-frontmatter.js
        language: system
        files: ^src/blog/.*\.md$

